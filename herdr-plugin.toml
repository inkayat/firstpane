id = "firstpane"
name = "Firstpane"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Terminal pane workspace of agents by project: status, branch, changes and numbered diffs, guarded Git, a browser per agent inside Firstpane or in a Ghostty tab, open pull requests and inline messages to FirstMate about selected lines. Not a native Agents or Spaces sidebar."
platforms = ["linux", "macos"]

[[panes]]
id = "tree"
title = "Firstpane"
placement = "split"
command = ["python3", "-m", "firstpane"]

[[actions]]
id = "toggle"
title = "Toggle Firstpane"
description = "Open Firstpane beside the focused pane, or close the Firstpane this action opened in the focused tab"
contexts = ["tab"]
command = ["python3", "-m", "firstpane.toggle"]
